[package]
name = "cclover-mon"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[workspace]
members = ["crates/cclover-core", "crates/cclover-presentation", "crates/cclover-ui", "crates/cclover-tui", "crates/cclover-web-ui", "crates/cclover-desktop"]

[features]
default = ["http", "ebpf-io"]
http = ["dep:wasm-bindgen-cli-support"]
ebpf-io = []

[dependencies]
cclover-core = { path = "crates/cclover-core" }
cclover-presentation = { path = "crates/cclover-presentation" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
wasm-bindgen-cli-support = { version = "=0.2.129", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cclover-desktop = { path = "crates/cclover-desktop" }
cclover-tui = { path = "crates/cclover-tui" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
cclover-web-ui = { path = "crates/cclover-web-ui" }
iced = { version = "0.14.0", default-features = false, features = ["canvas", "crisp", "fira-sans", "webgl", "wgpu"] }
wasm-bindgen = "=0.2.129"
web-sys = { version = "=0.3.106", features = ["EventSource", "MessageEvent"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Wdk_System_SystemInformation",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

# Iced 0.14 WebGL can corrupt multi-Canvas geometry and clipping across layers.
# Pin only iced_widget until upstream fixes iced-rs/iced#2400.
[patch.crates-io]
iced_widget = { git = "https://github.com/fkxxyz/iced.git", rev = "0330c6ca303d2c2260cb69fa1b39e17080d62e6d" }
