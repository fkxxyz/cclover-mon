[package]
name = "cclover-desktop"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
cclover-core = { path = "../cclover-core" }
cclover-presentation = { path = "../cclover-presentation" }
cclover-ui = { path = "../cclover-ui" }

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }
