[package]
name = "cclover-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cclover-mon-server"
path = "src/main.rs"

[features]
# Process I/O attribution through libbpf. Disable for builds without clang/libbpf or BTF support.
default = ["ebpf-io"]
ebpf-io = ["cclover-platform/ebpf-io"]

[dependencies]
cclover-http = { path = "../cclover-http" }
cclover-runtime = { path = "../cclover-runtime" }
cclover-platform = { path = "../cclover-platform", default-features = false }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
ctrlc = "3"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Services"] }
