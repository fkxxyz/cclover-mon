[package]
name = "cclover-mon"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
wasm-bindgen-cli-support = "=0.2.129"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
iced = { version = "0.14.0", default-features = false, features = ["canvas", "crisp", "smol", "wgpu", "wayland", "x11"] }
smol = "2.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
iced = { version = "0.14.0", default-features = false, features = ["canvas", "crisp", "fira-sans", "webgl", "wgpu"] }
wasm-bindgen = "=0.2.129"
web-sys = { version = "=0.3.106", features = ["EventSource", "MessageEvent"] }

[target.'cfg(target_os = "linux")'.dependencies]
iced_layershell = "0.19.1"
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }
libc = "0.2"
x11rb = { version = "0.13.2", features = ["shape"] }
winit-common = "=0.31.0-beta.2"
winit-core = "=0.31.0-beta.2"

# Iced 0.14 WebGL can lose all but the last Canvas after layer merging.
# Pin only iced_widget until upstream fixes iced-rs/iced#2400.
[patch.crates-io]
iced_widget = { git = "https://github.com/fkxxyz/iced.git", rev = "32de7aa372582871bcf7bbbdae085f98f17b25ca" }
