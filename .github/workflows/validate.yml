name: validate

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: bun validate.ts fast

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install native build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang libbpf-dev libelf-dev pkg-config
          libcairo2-dev libx11-dev libxext-dev libxrender-dev libwayland-dev
      - run: bun validate.ts linux

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install native build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang libbpf-dev libelf-dev pkg-config
      - run: bun validate.ts server

  windows-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-xwin --locked
      - run: bun validate.ts windows

  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bun validate.ts windows-native

  web-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: browser-actions/setup-chrome@v1
      - uses: Swatinem/rust-cache@v2
      - name: Install native build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang libbpf-dev libelf-dev pkg-config
          libcairo2-dev libx11-dev libxext-dev libxrender-dev libwayland-dev
      - run: bun validate.ts web-browser
