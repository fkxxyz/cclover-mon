[package]
name = "cclover-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cclover-mon-server"
path = "src/main.rs"

[dependencies]
cclover-http = { path = "../cclover-http" }
cclover-runtime = { path = "../cclover-runtime" }
cclover-platform = { path = "../cclover-platform", default-features = false, features = ["ebpf-io"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
ctrlc = "3"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Services"] }
